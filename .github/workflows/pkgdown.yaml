# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [master]
    paths: 
      - '.github/workflows/pkgdown.yaml'
      - 'vignettes/**'
      - 'man/**.Rd'
      - 'README.md'
      - 'DESCRIPTION'
      - 'LICENSE'      
      - 'NEWS.md'
      - '_pkgdown.yml'
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
  
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
      
name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
          
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          token: ${{ secrets.GH_DOCS }}
          branch: gh-pages
          # Publish the built site, not the whole repository.
          #
          # `folder: .` copied the entire source tree to gh-pages, including
          # .gitignore -- which contains `docs/`. The action stages with
          # `git add`, and git only ignores UNTRACKED paths, so already-tracked
          # files under docs/ kept updating while every NEW file was silently
          # skipped. Nothing new has reached the published site since `docs/`
          # entered .gitignore on 2025-10-23.
          #
          # That is why the site renders unstyled: pkgdown moved from Bootstrap
          # 5.3.1 to 5.3.8, index.html (tracked) updated to reference
          # deps/bootstrap-5.3.8/, and the new directory was never added -- so
          # the page asks for a stylesheet that returns 404.
          #
          # Deploying `docs` into `docs/` keeps the published path the GitHub
          # Pages setting expects (gh-pages branch, /docs), while no longer
          # copying the source tree at all.
          folder: docs
          target-folder: docs
          clean: false
