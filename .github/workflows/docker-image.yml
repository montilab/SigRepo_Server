name: SigRepo Docker Build

on:
  # dev is here because montilab.bu.edu runs it and needs an image whose R
  # environment matches. The dev build is gated in the `decide` job below
  # rather than by a second `push:` key with its own paths filter: YAML keeps
  # only the last duplicate key, so that spelling would silently delete the
  # master build.
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  # Decides whether this push deserves an image, and under which tag.
  #
  # On master/main: always build, tag :latest, bake the master client.
  # On dev: build only when the R environment itself changed, tag :dev, bake
  # the dev client. Everything else on dev is bind-mounted into the running
  # containers, so the image does not need to move -- and publishing on every
  # dev merge is the expensive part worth avoiding.
  decide:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
      sigrepo_branch: ${{ steps.check.outputs.sigrepo_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF" != "dev" ]; then
            echo "tag=latest"          >> "$GITHUB_OUTPUT"
            echo "sigrepo_branch=master" >> "$GITHUB_OUTPUT"
            echo "build=true"          >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=dev"            >> "$GITHUB_OUTPUT"
          echo "sigrepo_branch=dev" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A first push to a new branch reports an all-zero "before", and
          # a diff against it is not meaningful: build rather than guess.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A force push leaves $BEFORE unreachable and git diff fails. Build
          # rather than skip: skipping would publish nothing for a force-pushed
          # Dockerfile change, and the next deploy would quietly run an image
          # that does not match the branch.
          if ! changed=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null); then
            echo "could not diff $BEFORE..$SHA (force push?); building to be safe"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^(Dockerfile|install_r_packages\.R|DESCRIPTION)$'; then
            echo "build=true"  >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      # The Docker Hub *login* identity (secrets.DOCKERHUB_USERNAME, a bot
      # account) is not the same thing as the *namespace* images should be
      # published under. montibot is a member of the montilab org with push
      # access to it, but pushing to "montibot/sigrepo" and "montilab/sigrepo"
      # are different repos on different accounts -- images must go to the
      # shared org namespace so docker-compose.yml (which hardcodes
      # montilab/...) actually picks them up.
      DOCKERHUB_NAMESPACE: montilab
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_repo: sigrepo-mysql
            context: mysql
            dockerfile: mysql/Dockerfile
            build_args: |
              mysql_image=mysql:8.0-bookworm
            extra_repos: ""
          - image_repo: sigrepo-api
            context: .
            dockerfile: Dockerfile
            build_args: |
              R_VERSION=4.4.3
            # "sigrepo" is load-bearing: docker-compose.yml pulls the API and
            # MCP services from montilab/sigrepo:latest. The old sigrepo-shiny
            # alias is gone -- it published this same API image under a name
            # implying it served the Shiny dashboard, which no longer exists
            # here (it moved to SigRepo_Server_Legacy). The served UI is now
            # sigrepo-web, built below from its own Dockerfile rather than
            # aliased onto this one.
            extra_repos: "sigrepo"
          # The React interface that replaced the Shiny dashboard. Until now it
          # had no published image at all -- docker-compose.yml only carried a
          # `build:` stanza, so every deployment had to compile the bundle on
          # the server. Publishing it makes deploying a pull like the others.
          - image_repo: sigrepo-web
            context: web
            dockerfile: web/Dockerfile
            build_args: ""
            extra_repos: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Not just 'push': a manual dispatch has to publish too, otherwise
        # workflow_dispatch only warms the build cache. It is also the only way
        # to create the first :dev image, because merging this workflow change
        # to dev touches nothing in the paths filter.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # matrix.extra_repos holds plain repo names (see note in the job-level
      # env above for why the namespace isn't secrets.DOCKERHUB_USERNAME).
      - name: Compute extra image tags
        id: extra_tags
        env:
          EXTRA_REPOS: ${{ matrix.extra_repos }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          {
            echo "tags<<TAGS_EOF"
            if [ -n "$EXTRA_REPOS" ]; then
              IFS=',' read -ra EXTRAS <<< "$EXTRA_REPOS"
              for repo in "${EXTRAS[@]}"; do
                echo "${DOCKERHUB_NAMESPACE}/${repo}:${TAG}"
                echo "${DOCKERHUB_NAMESPACE}/${repo}:${SHA}"
              done
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image_repo }}
        # sigrepo-mysql and sigrepo-web build from mysql/ and web/ and are not
        # under test on the staging line, so a dev run builds only the API.
        if: ${{ github.ref_name != 'dev' || matrix.image_repo == 'sigrepo-api' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Concatenated, not a two-line block: matrix.build_args is a block
          # scalar that already ends in a newline, and sigrepo-web's is empty.
          # A literal two-line form would hand the action a leading blank line
          # for that entry, and relying on it to discard one is an unnecessary
          # bet. This yields exactly the arguments, with no blank lines.
          build-args: ${{ matrix.build_args }}SIGREPO_BRANCH=${{ needs.decide.outputs.sigrepo_branch }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image_repo }}:${{ needs.decide.outputs.tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image_repo }}:${{ github.sha }}
            ${{ steps.extra_tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image_repo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_repo }}
