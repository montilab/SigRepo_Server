name: test

on:
  push:
    # dev is the integration branch: work lands there first and only reaches
    # master for a release, so the suite has to run here or changes go
    # unverified until release time. The image build (docker-image.yml)
    # deliberately still fires on master only -- publishing on every dev merge
    # is the expensive part, and nothing consumes a dev image.
    branches: [main, master, dev]
    paths:
      - "api/**"
      - "mcp/**"
      - "mysql/schema/**"
      - "tests/**"
      - "DESCRIPTION"
      - "install_r_packages.R"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  testthat-integration:
    runs-on: ubuntu-latest
    # Run inside the image this repository already publishes. It is built from
    # the same Dockerfile that installs the apt list and every R package the
    # suite needs, so installing them again on a bare runner was rebuilding an
    # environment we ship anyway.
    #
    # That install was the entire cost of this job. Across recent runs
    # `Install system dependencies` + `setup-r` took 39%, 86%, 85% and 98% of
    # total wall time; one run spent 96.8 of 98.4 minutes there to run a test
    # suite that finished in 24 seconds. Both steps are uncached network work
    # and varied 100x between runs. The R library cache was never the problem --
    # it hit every time, including on that 98 minute run.
    container: montilab/sigrepo:latest
    concurrency:
      group: test-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sigrepo_test
          MYSQL_USER: sigrepo_test
          MYSQL_PASSWORD: sigrepo_test_pw
          MYSQL_ROOT_PASSWORD: sigrepo_root_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -psigrepo_root_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_NAME: sigrepo_test
      # 'mysql' is the service label below. Inside a container the job joins
      # the service network directly, where 127.0.0.1 is the job's own
      # container -- the published port only exists on the runner host.
      DB_LOCAL_HOST: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: sigrepo_root_pw
      ADMIN_KEY: ci-test-admin-key
      SENDMAIL_KEY: ci-test-sendmail-key
      DIFEXP_DIR: ${{ github.workspace }}/tmp_ci_difexp
      SIGREPO_SERVER_DIR: ${{ github.workspace }}
      SIGREPO_DIR: ${{ github.workspace }}/external/SigRepo
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout SigRepo_Server
        uses: actions/checkout@v4

      - name: Checkout SigRepo (client package, loaded in dev mode)
        uses: actions/checkout@v4
        with:
          repository: montilab/SigRepo
          path: external/SigRepo

      # The image ships libmysqlclient for RMySQL but not the mysql CLI, which
      # the schema-load and seed steps below use. One small package, ~5s.
      - name: Install the MySQL client
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends default-mysql-client

      # Everything the suite imports is already in the image; these two are in
      # Suggests, so the Dockerfile's dependency install skips them.
      - name: Install test-only packages
        run: Rscript -e 'install.packages(c("testthat", "pkgload"), repos = "https://cloud.r-project.org")'

      # Kept as a safety net for a change that adds a dependency the published
      # image predates -- install_r_packages.R skips anything already present,
      # so on an up-to-date image this is a no-op rather than a reinstall.
      - name: Install any dependency the image predates
        run: Rscript install_r_packages.R

      # Same intent for SigRepo's own imports. Guarded on installed.packages()
      # because install.packages() reinstalls unconditionally, and all of these
      # are already in the image -- calling it directly would spend a minute
      # rebuilding what is there.
      - name: Install any SigRepo dependency the image predates
        run: |
          Rscript -e '
            have <- rownames(installed.packages())
            bioc <- setdiff(c("limma", "biomaRt"), have)
            if (length(bioc)) BiocManager::install(bioc, ask = FALSE, update = FALSE)
            cran <- setdiff(c("digest", "purrr", "readr", "rlang"), have)
            if (length(cran)) install.packages(cran)
            cat("installed:", if (length(c(bioc, cran))) paste(c(bioc, cran), collapse = ", ") else "nothing needed", "\n")
          '

      - name: Install hypeR, OmicSignature and hypeR.GEM
        run: |
          Rscript -e '
            # install_github() can fail to fetch the tarball, print the error,
            # and still exit 0 -- seen on 2026-08-17, when a GitHub API blip
            # left OmicSignature uninstalled and the job carried on to fail nine
            # test files deep with "The package OmicSignature is required".
            # Retry the fetch, then check installed.packages() rather than the
            # exit status, so a genuine failure stops here where the cause is
            # readable. This only ever bites on a cache miss; the R library
            # cache normally carries both packages over from a prior run.
            # hypeR.GEM backs the GEM annotate methods. It is optional at
            # runtime (the route answers 503 without it), but installed here so
            # CI exercises that path rather than skipping it silently.
            repos <- c(
              OmicSignature = "montilab/OmicSignature",
              hypeR = "montilab/hypeR",
              hypeR.GEM = "montilab/hypeR-GEM"
            )
            for (pkg in names(repos)) {
              for (attempt in 1:3) {
                try(remotes::install_github(
                  repos[[pkg]],
                  dependencies = c("Depends", "Imports", "LinkingTo"),
                  upgrade = "never"
                ))
                if (pkg %in% rownames(installed.packages())) break
                message(sprintf("%s not installed after attempt %d; retrying...", pkg, attempt))
                Sys.sleep(15 * attempt)
              }
            }
            missing <- setdiff(names(repos), rownames(installed.packages()))
            if (length(missing) > 0) {
              stop("Failed to install from GitHub after 3 attempts: ", paste(missing, collapse = ", "))
            }
          '

      - name: Load MySQL schema
        run: |
          {
            echo "SET FOREIGN_KEY_CHECKS=0;"
            for f in mysql/schema/*.sql; do cat "$f"; echo ";"; done
            echo "SET FOREIGN_KEY_CHECKS=1;"
          } > /tmp/schema.sql
          mysql -h"$DB_HOST" -uroot -psigrepo_root_pw sigrepo_test < /tmp/schema.sql

      - name: Seed test fixtures
        run: mysql -h"$DB_HOST" -uroot -psigrepo_root_pw sigrepo_test < tests/testthat/fixtures/seed.sql

      - name: Run testthat
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Boot Plumber API and smoke-check routes
        run: |
          mkdir -p "${DIFEXP_DIR}"
          Rscript api/run_sigrepo_api.R > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3838/__docs__/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3838/__docs__/ >/dev/null
          curl -fsS http://127.0.0.1:3838/openapi.json >/dev/null
          kill "$(cat /tmp/api.pid)" || true

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/api.log || true

      - name: Boot MCP server and smoke-check tools/list
        env:
          MCP_PORT: 8021
        run: |
          Rscript mcp/run_sigrepo_mcp.R > /tmp/mcp.log 2>&1 &
          echo $! > /tmp/mcp.pid
          for i in $(seq 1 30); do
            curl -fsS -X POST http://127.0.0.1:8021 -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' >/dev/null 2>&1 && break
            sleep 2
          done
          response=$(curl -fsS -X POST http://127.0.0.1:8021 -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          echo "$response"
          echo "$response" | grep -q '"search_signatures"'
          echo "$response" | grep -q '"get_signature_context"'
          echo "$response" | grep -q '"compare_signatures"'
          echo "$response" | grep -q '"list_vocabulary"'
          echo "$response" | grep -q '"search_collections"'
          echo "$response" | grep -q '"search_geneset_resources"'
          echo "$response" | grep -q '"search_geneset_entries"'
          echo "$response" | grep -q '"search_features"'
          echo "$response" | grep -q '"run_enrichment"'
          kill "$(cat /tmp/mcp.pid)" || true

      - name: Show MCP server log on failure
        if: failure()
        run: cat /tmp/mcp.log || true
