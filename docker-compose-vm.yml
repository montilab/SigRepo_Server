x-sql-volume:
  &sql-volume
  type: bind
  source: /mysql/database
  target: /var/lib/mysql
  
x-difexp-volume:
  &difexp-volume
  type: bind
  source: /mysql/difexp
  target: /difexp
  
x-omic-signature-volume:
  &omic-signature-volume
  type: bind
  source: /OmicSignature
  target: /OmicSignature
 
x-hyper-volume:
  &hyper-volume
  type: bind
  source: /hypeR
  target: /hypeR
  
# NOTE: this mount is NOT how a client change is deployed, despite appearances.
# SigRepo is an R package, and the API, MCP and Shiny call SigRepo:: by
# namespace, which resolves from the installed library -- inside the container
# find.package("SigRepo") returns /usr/local/lib/R/site-library/SigRepo. Nothing
# calls pkgload::load_all() on this path. The mount is there for inspection.
#
# So `git pull` in /SigRepo changes nothing that runs. A client change reaches
# this server only by pulling an image rebuilt with SIGREPO_BRANCH. Contrast
# /SigRepo_Server below, which IS live: its .R files are sourced by path, so a
# pull plus restart really does deploy it.
x-sigrepo-volume:
  &sigrepo-volume
  type: bind
  source: /SigRepo
  target: /SigRepo  

x-sigrepo-server-volume:
  &sigrepo-server-volume
  type: bind
  source: /SigRepo_Server
  target: /SigRepo_Server
  
services:
  sigrepo-mysql:
    container_name: sigrepo-mysql
    platform: linux/amd64
    image: montilab/sigrepo-mysql:latest
    env_file:
      - .mysql_env
    networks:
      - db-net
    ports:
      - 3306:3306
    restart: always
    volumes:
      - *sql-volume
    command: ["--default-authentication-plugin=mysql_native_password"]

  sigrepo-api:
    container_name: sigrepo-api
    platform: linux/amd64
    image: montilab/sigrepo:latest
    depends_on:
      - sigrepo-mysql
    networks:
      - db-net
    ports:
      - 8020:3838
    restart: always
    volumes:
      - *difexp-volume
      - *sigrepo-volume
      - *sigrepo-server-volume
      - .Renviron:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/api/api-server.sh"]

  # The React single-page app, built to static assets and served by nginx,
  # which also proxies /api to sigrepo-api so the browser talks to a single
  # origin. It is no longer the served interface -- sigrepo-shiny below is --
  # but it is kept here so it can still be run against the same database.
  sigrepo-web:
    container_name: sigrepo-web
    platform: linux/amd64
    # image + build together on purpose: `docker compose pull` fetches the
    # CI-published image (so a deploy never compiles the bundle on the VM),
    # while `docker compose build sigrepo-web` still rebuilds from ./web when
    # testing an uncommitted change on the box.
    image: montilab/sigrepo-web:latest
    build:
      context: ./web
    depends_on:
      - sigrepo-api
    networks:
      - db-net
    ports:
      - 8050:80
    restart: always

  # The SigRepo web interface: the R Shiny app in legacy_app/, run by Shiny
  # Server. This is the interface sigrepo.org serves -- the reverse proxy on
  # the box routes / here; the React app above is kept but no longer served.
  # Shiny takes 8051; React keeps 8050.
  #
  # Two properties this service has that sigrepo-web does not, and that are the
  # reason it is the one served: it bind-mounts the source, so a UI change ships
  # with `git pull` and a restart rather than an image build; and Shiny Server
  # gives each user their own R process, so enrichment runs in the user's
  # session instead of queueing behind everyone else in the single-process API.
  sigrepo-shiny:
    container_name: sigrepo-shiny
    platform: linux/amd64
    image: montilab/sigrepo:latest
    depends_on:
      - sigrepo-mysql
      - sigrepo-api
    networks:
      - db-net
    ports:
      - 8051:3838
    restart: always
    volumes:
      - *difexp-volume
      - *hyper-volume
      - *sigrepo-volume
      - *sigrepo-server-volume
      - *omic-signature-volume
      - .Renviron:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/legacy_app/shiny-server.sh"]

  # Agentic AI-facing MCP server. No `ports:` mapping on purpose -- it's only
  # reachable by other containers on db-net, not published to the host/
  # internet, since its only auth today is a per-call api_key with no rate
  # limiting. Use an SSH tunnel or the rate-limiting reverse proxy below
  # (sigrepo-mcp-proxy) if remote agent access is needed.
  sigrepo-mcp:
    container_name: sigrepo-mcp
    platform: linux/amd64
    image: montilab/sigrepo:latest
    depends_on:
      - sigrepo-mysql
    networks:
      - db-net
    restart: always
    volumes:
      - *sigrepo-volume
      - *sigrepo-server-volume
      - .Renviron:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/mcp/mcp-server.sh"]

  # The only way in to sigrepo-mcp: it has no host port of its own (see
  # above), so this is the sole published port for MCP access. Adds rate
  # limiting in front, per mcp/proxy/nginx.conf -- auth is just sigrepo-mcp's
  # own per-call api_key (the same SigRepo account credential used by the
  # REST API), not a second, unrelated login.
  #
  # This proxy only speaks plain HTTP, so on this VM it stays bound to
  # 127.0.0.1 (the default) and is reached from outside only via the
  # TLS-terminating nginx already running natively on this host, which
  # proxies https://sigrepo.org/mcp/ to it -- see
  # /etc/nginx/conf.d/sigrepo.org.conf on the server itself (not tracked in
  # this repo).
  sigrepo-mcp-proxy:
    container_name: sigrepo-mcp-proxy
    image: nginx:alpine
    depends_on:
      - sigrepo-mcp
    networks:
      - db-net
    ports:
      - "${MCP_PROXY_BIND:-127.0.0.1}:${MCP_PROXY_PORT:-8021}:8021"
    restart: always
    volumes:
      - ./mcp/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  db-net:
    external: true
