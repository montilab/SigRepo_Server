# Local development stack, shaped to match the production VM.
#
# The point of this file is fidelity: it mirrors docker-compose-vm.yml, which is
# what actually runs on the server, rather than docker-compose.yml, which is the
# simpler "just give me a SigRepo" arrangement. The difference matters:
#
#   * Production bind-mounts the SOURCE (/SigRepo_Server, /SigRepo) over the
#     image's copies, so the API and MCP run the host checkout and a deploy is
#     `git pull` + restart -- not an image pull. A local stack without those
#     mounts runs the image's baked-in code, so it cannot reproduce how a code
#     change actually reaches production.
#
#   * Production keeps MySQL data and difexp on the host filesystem, not in
#     named volumes, so the data is inspectable and survives `down -v`.
#
# Differences from production, all deliberate:
#
#   * Every port binds to 127.0.0.1. Production publishes 8020/8050/3306 on
#     0.0.0.0, which is how they answer directly from the internet bypassing
#     nginx and TLS. There is no reason to reproduce that on a laptop.
#   * Paths are relative to this file, so the stack is portable rather than
#     tied to one machine's home directory.
#
# Usage:
#   docker compose -f docker-compose-local.yml -p sigrepo_local up -d
#
# Data lives in ./.local-data/ (gitignored). Delete that directory to start
# from an empty database.

x-sql-volume: &sql-volume
  type: bind
  source: ./.local-data/database
  target: /var/lib/mysql

x-difexp-volume: &difexp-volume
  type: bind
  source: ./.local-data/difexp
  target: /difexp

# The sibling checkouts, mounted over the image's copies exactly as the VM does.
x-sigrepo-volume: &sigrepo-volume
  type: bind
  source: ../SigRepo
  target: /SigRepo

x-sigrepo-server-volume: &sigrepo-server-volume
  type: bind
  source: .
  target: /SigRepo_Server

services:
  sigrepo-mysql:
    container_name: sigrepo-local-mysql
    platform: linux/amd64
    image: montilab/sigrepo-mysql:latest
    env_file:
      - .env.local
    networks:
      - db-net-local
    ports:
      - 127.0.0.1:3306:3306
    restart: unless-stopped
    volumes:
      - *sql-volume
    command: ["--default-authentication-plugin=mysql_native_password"]

  sigrepo-api:
    container_name: sigrepo-local-api
    platform: linux/amd64
    image: montilab/sigrepo:latest
    depends_on:
      - sigrepo-mysql
    networks:
      - db-net-local
    ports:
      - 127.0.0.1:8020:3838
    restart: unless-stopped
    volumes:
      - *difexp-volume
      - *sigrepo-volume
      - *sigrepo-server-volume
      - ./.Renviron.local-stack:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/api/api-server.sh"]

  sigrepo-web:
    container_name: sigrepo-local-web
    platform: linux/amd64
    # image + build: pull the published one to match production exactly, or
    # `docker compose -f docker-compose-local.yml build sigrepo-web` to test an
    # uncommitted interface change.
    image: montilab/sigrepo-web:latest
    build:
      context: ./web
    depends_on:
      - sigrepo-api
    networks:
      - db-net-local
    ports:
      - 127.0.0.1:8050:80
    restart: unless-stopped

  sigrepo-mcp:
    container_name: sigrepo-local-mcp
    platform: linux/amd64
    image: montilab/sigrepo:latest
    depends_on:
      - sigrepo-mysql
    networks:
      - db-net-local
    restart: unless-stopped
    volumes:
      - *difexp-volume
      - *sigrepo-volume
      - *sigrepo-server-volume
      - ./.Renviron.local-stack:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/mcp/mcp-server.sh"]

  sigrepo-mcp-proxy:
    container_name: sigrepo-local-mcp-proxy
    image: nginx:alpine
    depends_on:
      - sigrepo-mcp
    networks:
      - db-net-local
    ports:
      - 127.0.0.1:8021:8021
    restart: unless-stopped
    volumes:
      - ./mcp/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  db-net-local:
    name: db-net-local
