x-sql-volume:
  &sql-volume
  type: bind
  source: /Users/cameronvicnaire/mysql/database
  target: /var/lib/mysql
  
x-difexp-volume:
  &difexp-volume
  type: bind
  source: /Users/cameronvicnaire/mysql/difexp
  target: /difexp
  
x-omic-signature-volume:
  &omic-signature-volume
  type: bind
  source: /Users/cameronvicnaire/Documents/GitHub/OmicSignature
  target: /OmicSignature
 
x-hyper-volume:
  &hyper-volume
  type: bind
  source: /Users/cameronvicnaire/Documents/GitHub/hypeR
  target: /hypeR
  
x-sigrepo-volume:
  &sigrepo-volume
  type: bind
  source: /Users/cameronvicnaire/Documents/GitHub/SigRepo
  target: /SigRepo  

x-sigrepo-server-volume:
  &sigrepo-server-volume
  type: bind
  source: /Users/cameronvicnaire/Documents/GitHub/SigRepo_Server
  target: /SigRepo_Server
  
services:
  sigrepo-mysql:
    container_name: sigrepo-mysql
    platform: linux/amd64
    image: sigrepo-mysql:latest
    build:
      context: mysql
      dockerfile: Dockerfile
      args:
        - mysql_image=mysql:8.0-bookworm
    env_file:
      - .mysql_env
    networks:
      - db-net
    ports:
      - 3306:3306
    restart: always
    volumes:
      - *sql-volume
    command: ["--default-authentication-plugin=mysql_native_password"]

  sigrepo-client:
    container_name: sigrepo-client
    platform: linux/amd64
    image: sigrepo:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - R_VERSION=4.5.0
        - SIGREPO_BRANCH=master
    restart: always
    command: tail -f /dev/null

  sigrepo-api:
    container_name: sigrepo-api
    platform: linux/amd64
    image: sigrepo:latest
    depends_on:
      - sigrepo-mysql
      - sigrepo-client
    networks:
      - db-net
    ports:
      - 8020:3838
    restart: always
    volumes:
      - *difexp-volume
      - *sigrepo-volume
      - *sigrepo-server-volume
      - .Renviron:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/api/api-server.sh"]

  # The React single-page app, built to static assets and served by nginx,
  # which also proxies /api to sigrepo-api so the browser talks to a single
  # origin. It is no longer the served interface -- sigrepo-shiny below is --
  # but it is kept here so it can still be run against the same database.
  sigrepo-web:
    container_name: sigrepo-web
    platform: linux/amd64
    build:
      context: ./web
    depends_on:
      - sigrepo-api
    networks:
      - db-net
    ports:
      - 8050:80
    restart: always

  # The SigRepo web interface: the R Shiny app in legacy_app/, run by Shiny
  # Server. This is the interface that is served; the React app above is kept
  # but no longer served. Shiny takes 8051; React keeps 8050.
  #
  # Two properties this service has that sigrepo-web does not, and that are the
  # reason it is the one served: it bind-mounts the source, so a UI change ships
  # with `git pull` and a restart rather than an image build; and Shiny Server
  # gives each user their own R process, so enrichment runs in the user's
  # session instead of queueing behind everyone else in the single-process API.
  sigrepo-shiny:
    container_name: sigrepo-shiny
    platform: linux/amd64
    image: montilab/sigrepo:latest
    depends_on:
      - sigrepo-mysql
      - sigrepo-api
    networks:
      - db-net
    ports:
      - 8051:3838
    restart: always
    volumes:
      - *difexp-volume
      - *hyper-volume
      - *sigrepo-volume
      - *sigrepo-server-volume
      - *omic-signature-volume
      - .Renviron:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/legacy_app/shiny-server.sh"]

  # Agentic AI-facing MCP server. No `ports:` mapping on purpose -- it's only
  # reachable by other containers on db-net, not published to the host/
  # internet, since its only auth today is a per-call api_key with no rate
  # limiting. Use an SSH tunnel or a reverse proxy with its own auth in front
  # if remote agent access is needed.
  sigrepo-mcp:
    container_name: sigrepo-mcp
    platform: linux/amd64
    image: sigrepo:latest
    depends_on:
      - sigrepo-mysql
      - sigrepo-client
    networks:
      - db-net
    restart: always
    volumes:
      - *sigrepo-volume
      - *sigrepo-server-volume
      - .Renviron:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/mcp/mcp-server.sh"]

networks:
  db-net:
    external: true   
    
    
