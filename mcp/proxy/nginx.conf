# Reverse proxy in front of sigrepo-mcp. sigrepo-mcp itself has no published
# host port (see docker-compose.yml) and its only auth is a per-call
# api_key with no rate limiting -- this is the chokepoint that adds a
# second, proxy-level auth check plus rate limiting before a request ever
# reaches it. Whether this proxy is reachable from just this machine or
# from the network is controlled entirely by how its port is bound in
# docker-compose.yml (MCP_PROXY_BIND/MCP_PROXY_PORT) -- nothing in this
# file changes between the local and multi-user cases.

# ~1 request every 2s per client IP, with short bursts allowed for an agent
# that fires off a few tool calls back to back. Tune to taste.
limit_req_zone $binary_remote_addr zone=mcp_zone:10m rate=30r/m;

server {
    listen 8021;

    location / {
        auth_basic           "SigRepo MCP";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req        zone=mcp_zone burst=10 nodelay;
        limit_req_status  429;

        # A variable (not a bare hostname) forces nginx to resolve
        # sigrepo-mcp at request time via Docker's embedded DNS, instead of
        # once at startup -- otherwise nginx refuses to boot at all if this
        # container starts marginally before sigrepo-mcp's DNS entry exists,
        # and won't notice if sigrepo-mcp's address changes later.
        resolver 127.0.0.11 valid=10s;
        set $sigrepo_mcp_upstream sigrepo-mcp;
        proxy_pass http://$sigrepo_mcp_upstream:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # run_enrichment can take a while (MSigDB fetch + a real statistical
        # test) -- nginx's 60s default proxy_read_timeout would cut a
        # legitimate slow call off before sigrepo-mcp finishes.
        proxy_read_timeout 120s;
    }
}
