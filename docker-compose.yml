x-sql-volume:
  &sql-volume
  type: bind
  source: /path/to/mysql/database
  target: /var/lib/mysql
  
x-difexp-volume:
  &difexp-volume
  type: bind
  source: /path/to/mysql/difexp
  target: /difexp
  
services:
  sigrepo-mysql:
    container_name: sigrepo-mysql
    platform: linux/amd64
    image: montilab/sigrepo-mysql:latest
    env_file:
      - .mysql_env
    networks:
      - db-net
    ports:
      - 3306:3306
    restart: always
    volumes:
      - *sql-volume
    command: ["--default-authentication-plugin=mysql_native_password"]

  sigrepo-api:
    container_name: sigrepo-api
    platform: linux/amd64
    image: montilab/sigrepo:latest
    depends_on:
      - sigrepo-mysql
    networks:
      - db-net
    ports:
      - 8020:3838
    restart: always
    volumes:
      - *difexp-volume
      - .Renviron:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/api/api-server.sh"]

  sigrepo-shiny:
    container_name: sigrepo-shiny
    platform: linux/amd64
    image: montilab/sigrepo:latest
    depends_on:
      - sigrepo-mysql
      - sigrepo-api
    networks:
      - db-net
    ports:
      - 8050:3838
    restart: always
    volumes:
      - .Renviron:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/shiny/shiny-server.sh"]

  # Agentic AI-facing MCP server. No `ports:` mapping on purpose -- it's only
  # reachable by other containers on db-net, not published to the host/
  # internet, since its only auth today is a per-call api_key with no rate
  # limiting. Use an SSH tunnel or a reverse proxy with its own auth in front
  # if remote agent access is needed.
  sigrepo-mcp:
    container_name: sigrepo-mcp
    platform: linux/amd64
    image: montilab/sigrepo:latest
    depends_on:
      - sigrepo-mysql
    networks:
      - db-net
    restart: always
    volumes:
      - .Renviron:/SigRepo_Server/.Renviron
    entrypoint: ["/bin/bash", "-c", "/SigRepo_Server/mcp/mcp-server.sh"]

  # The only way in to sigrepo-mcp: it has no host port of its own (see
  # above), so this is the sole published port for MCP access. Adds a
  # second auth layer (HTTP basic auth, distinct from sigrepo-mcp's own
  # per-call api_key) and rate limiting in front, per mcp/proxy/nginx.conf.
  #
  # Same compose file covers both deployment shapes:
  #   - one person, local machine: leave MCP_PROXY_BIND at its default
  #     (127.0.0.1) -- nothing outside this machine can reach it.
  #   - shared server, multiple people: set MCP_PROXY_BIND=0.0.0.0 (or a
  #     specific interface) in .env so the auth+rate-limit layer is what's
  #     actually doing the protecting.
  #
  # Requires mcp/proxy/.htpasswd to exist first -- see
  # mcp/proxy/.htpasswd.example for how to generate it. It is gitignored
  # and must never be committed.
  sigrepo-mcp-proxy:
    container_name: sigrepo-mcp-proxy
    image: nginx:alpine
    depends_on:
      - sigrepo-mcp
    networks:
      - db-net
    ports:
      - "${MCP_PROXY_BIND:-127.0.0.1}:${MCP_PROXY_PORT:-8021}:8021"
    restart: always
    volumes:
      - ./mcp/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mcp/proxy/.htpasswd:/etc/nginx/.htpasswd:ro

networks:
  db-net:
    external: true   
    
    
