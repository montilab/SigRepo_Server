# nginx config for the SigRepo React interface container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the text assets; the JS bundle dominates transfer size.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name, so they can be
    # cached hard. index.html must not be, or clients pin an old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API lives behind the same origin so the browser never talks to
    # sigrepo-api directly and no CORS is involved. The React client calls
    # "/api/..." and the API's own routes have no /api prefix, so strip it.
    #
    # A variable (not a bare hostname) forces nginx to resolve sigrepo-api at
    # request time via Docker's embedded DNS, so this container still starts if
    # the API is not up yet, and follows it if its address changes.
    #
    # The rewrite is required, not stylistic: when proxy_pass uses a variable,
    # nginx does not substitute the matched location prefix the way it does for
    # a literal upstream, so a trailing "/" on proxy_pass would send every
    # request to "/" with its path dropped. Rewriting first, and leaving
    # proxy_pass without a URI part, passes the stripped path through.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $sigrepo_api_upstream sigrepo-api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$sigrepo_api_upstream:3838;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enrichment and signature comparison do real statistical work; nginx's
        # 60s default would cut off a legitimately slow call.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Difexp downloads and signature exports can be large.
        client_max_body_size 100m;
        proxy_buffering off;
    }

    # Client-side routing: any path that is not a real file is served
    # index.html so deep links and refreshes resolve instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
